<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Apex — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--p:#2563eb;--psoft:#e8efff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#131a2a;--ink:#e6ebf7;--muted:#94a3b8;--line:#243049;--p:#7aa7ff;--psoft:#1b2a52}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
.w{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font:900 1.4rem "Cairo",sans-serif}
h2{font:800 .95rem "Cairo",sans-serif;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.top{display:flex;align-items:center;gap:8px}.top h1{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font:700 .85rem "Tajawal",sans-serif;cursor:pointer}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font:900 1.7rem "Cairo",sans-serif;color:var(--p);line-height:1.2}.kpi span{color:var(--muted);font-size:.78rem;font-weight:700}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem;white-space:nowrap}
th{color:var(--muted);font-weight:700;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.8rem;font-weight:700}
.bar i{display:block;height:9px;border-radius:9px;background:linear-gradient(90deg,#eab308,#f97316);min-width:3px}
.bar span:first-child{min-width:54px}
.cm{padding:8px 0;border-bottom:1px solid var(--line);font-size:.85rem;line-height:1.7}.cm small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--psoft);color:var(--p);border-radius:99px;padding:4px 10px;font-weight:800;font-size:.78rem}
input{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:600 1rem "Tajawal",sans-serif;margin-bottom:10px;direction:ltr;text-align:left}
.err{color:#dc2626;font-weight:700;font-size:.85rem;min-height:1.2em;margin-bottom:8px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="w">
  <div class="top"><h1>لوحة تحكم Apex</h1><button class="btn hide" id="bRef">تحديث</button><button class="btn hide" id="bOut">خروج</button></div>

  <form class="card" id="login">
    <h2>دخول المشرف</h2>
    <input id="em" type="email" placeholder="الإيميل" autocomplete="email">
    <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
    <div class="err" id="err"></div>
    <button class="btn p" type="submit" style="width:100%">دخول</button>
  </form>

  <div id="out" class="hide" style="display:flex;flex-direction:column;gap:12px"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB = supabase.createClient('https://rrawopvmicramzqhxivz.supabase.co', 'sb_publishable_A2DCcrW7PBc3rEgDu6CoNA_WEhzhnzF');
const $ = id => document.getElementById(id);
function el(t,c,x){ const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }
function card(title){ const c=el('div','card'); c.appendChild(el('h2',null,title)); return c; }
function table(head, rows){
  const sc=el('div','sc'), t=el('table'), tr=el('tr'); head.forEach(h=>tr.appendChild(el('th',null,h))); t.appendChild(tr);
  rows.forEach(r=>{ const row=el('tr'); r.forEach(v=>row.appendChild(el('td',null,v==null?'—':v))); t.appendChild(row); });
  sc.appendChild(t); return sc;
}
const fd = s => s ? new Date(s).toLocaleString('ar',{dateStyle:'short',timeStyle:'short'}) : '—';

async function boot(){
  const { data } = await SB.auth.getSession();
  if(data.session) await enter(); 
}
async function enter(){
  const a = await SB.rpc('is_admin');
  if(a.error || !a.data){ $('err').textContent = 'هذا الحساب ليس مشرفاً'; await SB.auth.signOut(); return; }
  $('login').classList.add('hide'); $('bRef').classList.remove('hide'); $('bOut').classList.remove('hide'); $('out').classList.remove('hide');
  load();
}
async function load(){
  const out = $('out'); out.innerHTML = '';
  out.appendChild(el('div','card','جارٍ التحميل…'));
  const [o,t] = await Promise.all([SB.rpc('admin_overview'), SB.rpc('admin_traces',{p_limit:20})]);
  out.innerHTML = '';
  if(o.error){ out.appendChild(el('div','card','تعذّر التحميل: ' + o.error.message)); return; }
  const d = o.data;
  const k = el('div','kpis');
  [['اللاعبون',d.players],['الألعاب المبدوءة',d.games],['وحوش 11 (إجمالي)',d.elevens],['متوسط التقييم',d.avg_rating==null?'—':d.avg_rating+' ★']].forEach(([n,v])=>{
    const x=el('div','kpi'); x.appendChild(el('b',null,v)); x.appendChild(el('span',null,n)); k.appendChild(x); });
  out.appendChild(k);

  let c = card('آخر 14 يوماً (بتوقيت UTC)');
  c.appendChild(table(['اليوم','لاعبون نشطون','ألعاب','وحوش 11'], (d.days||[]).map(x=>[x.d,x.active,x.games,x.elevens]))); out.appendChild(c);

  c = card('ترتيب اللاعبين');
  c.appendChild(table(['#','اللاعب','وحوش 11','ألعاب بـ11','أفضل نقاط','آخر ظهور'], (d.top||[]).map((x,i)=>[i+1,x.username,x.elevens,x.games11,x.best,fd(x.last_seen)]))); out.appendChild(c);

  c = card('أين تنتهي الألعاب؟ (أقوى مستوى عند الخسارة)');
  const lost = (d.lost_at||[]).filter(x=>x.lvl!=null), mx = Math.max(1,...lost.map(x=>x.c));
  lost.forEach(x=>{ const b=el('div','bar'); b.appendChild(el('span',null,'مستوى '+x.lvl)); const i=el('i'); i.style.width=(x.c/mx*60)+'%'; b.appendChild(i); b.appendChild(el('span',null,x.c+' · متوسط '+x.avg_moves+' حركة')); c.appendChild(b); });
  if(!lost.length) c.appendChild(el('div',null,'لا بيانات بعد'));
  out.appendChild(c);

  c = card('استعمال الأدوات'); const ch=el('div','chips');
  const names={upgrade:'ترقية',swap:'تبديل',delete:'حذف',ai_step:'ذكاء اصطناعي'};
  Object.entries(d.tools||{}).forEach(([n,v])=>ch.appendChild(el('span',null,(names[n]||n)+' · '+v)));
  if(!ch.children.length) ch.appendChild(el('span',null,'لا بيانات بعد'));
  c.appendChild(ch); out.appendChild(c);

  c = card('التقييمات والآراء');
  const r = d.ratings||{}, ch2=el('div','chips'); [5,4,3,2,1].forEach(n=>ch2.appendChild(el('span',null,n+'★ · '+(r[n]||0)))); c.appendChild(ch2);
  (d.comments||[]).forEach(x=>{ const m=el('div','cm'); m.appendChild(el('div',null,'★'.repeat(x.rating)+'  '+x.comment)); m.appendChild(el('small',null,x.username+' · '+fd(x.created_at))); c.appendChild(m); });
  out.appendChild(c);

  c = card('مسارات الألعاب الناجحة (آخر 20)');
  if(t.error) c.appendChild(el('div',null,'تعذّر التحميل'));
  else{
    const rows=(t.data||[]); const sc=el('div','sc'), tb=el('table'), h=el('tr'); ['اللاعب','11','حركات','نقاط','يوم',''].forEach(x=>h.appendChild(el('th',null,x))); tb.appendChild(h);
    rows.forEach(x=>{ const tr=el('tr'); [x.username,x.n11,x.moves,x.score,x.day].forEach(v=>tr.appendChild(el('td',null,v==null?'—':v)));
      const td=el('td'), b=el('button','btn','نسخ'); b.onclick=async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify({player:x.username,init:x.init,tokens:x.tokens,n11:x.n11,moves:x.moves})); b.textContent='تم ✓'; }catch(e){ b.textContent='تعذّر'; } };
      td.appendChild(b); tr.appendChild(td); tb.appendChild(tr); });
    sc.appendChild(tb); c.appendChild(sc);
    c.appendChild(el('div','cm','انسخ مساراً وأرسله لي في المحادثة لأحلّله وأضبط الذكاء الاصطناعي عليه.'));
  }
  out.appendChild(c);
}
$('login').onsubmit = async e => {
  e.preventDefault(); $('err').textContent = '';
  const r = await SB.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if(r.error){ $('err').textContent = 'الإيميل أو كلمة السر غير صحيحة'; return; }
  enter();
};
$('bRef').onclick = load;
$('bOut').onclick = async () => { await SB.auth.signOut(); location.reload(); };
boot();
</script>
</body>
</html>
